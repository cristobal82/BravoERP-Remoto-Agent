name: Windows Store MSIX

on:
  push:
    branches:
      - codex/microsoft-store-msix
    paths:
      - .github/workflows/windows-store-msix.yml
      - meshcore/**
      - meshservice/**
      - packaging/msix/**
  workflow_dispatch:
    inputs:
      version:
        description: MSIX version (four numeric parts)
        required: true
        default: 1.0.0.0
      identity_name:
        description: Package identity name from Partner Center
        required: true
        default: BravoERP.RemotoAgent
      publisher:
        description: Publisher distinguished name from Partner Center
        required: true
        default: CN=BravoERP Store Placeholder

jobs:
  package-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v3
      - name: Build x64 agent
        run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=x64
      - name: Build Store MSIX
        shell: pwsh
        run: |
          $packageVersion = '${{ github.event.inputs.version }}'
          $identityName = '${{ github.event.inputs.identity_name }}'
          $publisher = '${{ github.event.inputs.publisher }}'
          if ([string]::IsNullOrWhiteSpace($packageVersion)) { $packageVersion = '1.0.0.0' }
          if ([string]::IsNullOrWhiteSpace($identityName)) { $identityName = 'BravoERP.RemotoAgent' }
          if ([string]::IsNullOrWhiteSpace($publisher)) { $publisher = 'CN=BravoERP Store Placeholder' }
          .\packaging\msix\Build-Msix.ps1 `
            -BinaryPath .\Release\MeshService64.exe `
            -Version $packageVersion `
            -IdentityName $identityName `
            -Publisher $publisher
      - name: Upload unsigned Store package
        uses: actions/upload-artifact@v7
        with:
          name: bravoerp-remoto-store-msix-x64
          path: |
            artifacts/BravoERP-Remoto-Agent.msix
            artifacts/BravoERP-Remoto-Agent.msix.sha256
